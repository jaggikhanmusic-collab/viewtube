<!DOCTYPE html>
<html lang="en">
<head>

        body { font-family: Arial, sans-serif; margin: 0; background-color: #121212; color: #ffffff; }

        .video-card { background: #222; width: 300px; padding: 15px; border-radius: 8px; border: 1px solid #444; }
        .video-card h3 { font-size: 16px; margin-bottom: 10px; color: #ffcc00; }

</head>
<body>
    <header>
        <div class="logo">VIEWTUBE</div>

    <div class="container">
        <h1>Welcome to VIEWTUBE</h1>
        <p>Your own video platform for News, Music, and Live Shows.</p>
        <div class="video-grid">
            <div class="video-card">
                <h3>JK Media News & Live Shows</h3>
                <p>Uploads coming soon...</p>
            </div>
            <div class="video-card">
                <h3>Punjabi Entertainment & DJ</h3>
                <p>Uploads coming soon...</p>
            </div>
        </div>
    </div>

</html>
